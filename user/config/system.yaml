timezone: null
custom_base_url: null
http_x_forwarded:
  protocol: true
  port: true
  ip: true
languages:
  supported:
    - en
  include_default_lang: false
pages:
  theme: hola
  process:
    markdown: true
    twig: false
  never_cache_twig: true
  markdown:
    extra: true
  types:
    - txt
    - xml
    - html
    - htm
    - json
    - rss
    - atom
  append_url_extension: null
  etag: false
  redirect_default_code: '302'
cache:
  check:
    interval: 10
  clear_images_by_default: true
  redis:
    socket: '0'
    server: null
    port: null
  memcache:
    server: null
    port: null
  memcached:
    server: null
    port: null
twig:
  debug: false
  autoescape: false
  umask_fix: false
assets:
  collections:
    jquery: 'system://assets/jquery/jquery-2.x.min.js'
errors:
  display: 1
debugger:
  token: null
  twig: true
images:
  cache_perms: '0755'
  auto_fix_orientation: false
  cls:
    retina_scale: '1'
media:
  unsupported_inline_types: null
  allowed_fallback_types: null
  upload_limit: 2097152
gpm:
  method: auto
  verify_peer: true
strict_mode:
  yaml_compat: true
  twig2_compat: true
